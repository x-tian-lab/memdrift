[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memdrift"
version = "0.1.0"
description = "Version control for agent memory: see what your agent changed about you, and roll it back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "memdrift contributors" }]
keywords = ["agent", "memory", "llm", "version-control", "markdown", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "click>=8.1",
    "python-frontmatter>=1.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# README screenshots are generated, not hand-taken
docs = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
memdrift = "memdrift.cli:main"

[project.urls]
Homepage = "https://github.com/x-tian-lab/memdrift"
Issues = "https://github.com/x-tian-lab/memdrift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/memdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
